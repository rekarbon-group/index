<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>École REKARBON · Français / Lingála</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Maquette navigable de l'école des métiers du carbone. Palette « sol et charbon » : fond argile clair, vert forêt profond, biochar, cuivre du four. Cases pointillées = où chaque donnée sera stockée. */
:root{
  --clay:#F3F0E8; --surface:#FFFFFF; --ink:#1B2420; --muted:#5F6B64; --line:#DCD9CE;
  --forest:#1F4D3A; --forest-ink:#FFFFFF; --leaf:#CFE3D4; --copper:#B5652B; --char:#121815;
  --on-char:#EEF2EC; --on-char-muted:#A9B6AE; --ok:#2E7A4F; --warn:#A86414; --db:#2F5D8C; --db-bg:#EAF1F8;
  --display:"Fraunces",Georgia,serif; --body:"Public Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-s:6px; --r-m:12px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --clay:#101512; --surface:#18201C; --ink:#E9EEE9; --muted:#9FAEA5; --line:#2C3832;
    --forest:#7FC39C; --forest-ink:#0E1A13; --leaf:#22392C; --copper:#E0935A; --char:#0A0E0C;
    --on-char:#EEF2EC; --on-char-muted:#A9B6AE; --ok:#79C99A; --warn:#E3A452; --db:#8DB8E4; --db-bg:#16222F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --clay:#101512; --surface:#18201C; --ink:#E9EEE9; --muted:#9FAEA5; --line:#2C3832;
  --forest:#7FC39C; --forest-ink:#0E1A13; --leaf:#22392C; --copper:#E0935A; --char:#0A0E0C;
  --on-char:#EEF2EC; --on-char-muted:#A9B6AE; --ok:#79C99A; --warn:#E3A452; --db:#8DB8E4; --db-bg:#16222F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--clay);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--char)}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,3rem)} h2{font-size:clamp(1.4rem,2.6vw,1.95rem)} h3{font-size:1.18rem}
p{margin:0} a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.84rem}
.stack{display:grid;gap:14px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kicker{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--copper)}

.mock{position:sticky;top:env(safe-area-inset-top,0px);z-index:55;background:var(--char);color:var(--on-char);font-size:.84rem}
.mock .wrap{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding-block:8px}
.mock b{font-family:var(--display);font-weight:500;font-size:1.02rem}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--on-char) 30%,transparent);border-radius:var(--r-pill);overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--on-char-muted);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--on-char);color:var(--char)}
.mock label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin:0;font-weight:400}
.mock select{background:var(--char);color:var(--on-char);border:1px solid color-mix(in srgb,var(--on-char) 30%,transparent);border-radius:var(--r-pill);padding:4px 10px;width:auto}
.mock .spacer{flex:1}

header.top{border-bottom:1px solid var(--line);background:var(--clay)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--char);display:grid;place-items:center}
.brand b{font-family:var(--display);font-weight:600;font-size:1.2rem;letter-spacing:.02em}
.brand span{display:block;font-size:.66rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
nav.main{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;align-items:center}
nav.main a{text-decoration:none;font-size:.92rem;padding:4px 0;border-bottom:1px solid transparent}
nav.main a[aria-current="page"]{border-bottom-color:var(--copper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-s);padding:10px 18px;font-weight:500;text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none}
.btn-primary{background:var(--forest);color:var(--forest-ink)}
.btn-ghost{border-color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--clay)}
.btn-small{padding:6px 12px;font-size:.86rem}
main.view{padding-block:30px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;min-width:0}
label{display:block;font-size:.86rem;font-weight:500;margin-bottom:6px}
input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--clay);border-radius:var(--r-s);padding:10px 12px}
textarea{min-height:100px;resize:vertical}
input.code{letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono)}
.hint{font-size:.83rem;color:var(--muted)}
.notice{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;font-size:.9rem;background:var(--surface)}
.err{color:var(--copper)}
.pill{display:inline-block;border-radius:var(--r-pill);padding:2px 10px;font-size:.76rem;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.used{color:var(--muted)} .pill.warn{color:var(--warn)} .pill.cu{color:var(--copper)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--forest)}

[data-db]{position:relative}
body.show-db [data-db]{outline:1.5px dashed var(--db);outline-offset:3px;border-radius:4px}
body.show-db [data-db]::after{content:attr(data-db);position:absolute;top:-11px;right:4px;z-index:5;background:var(--db-bg);color:var(--db);font:500 .64rem/1.4 var(--mono);padding:1px 6px;border-radius:4px;border:1px solid var(--db);white-space:nowrap;pointer-events:none;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis}
.db-legend{display:none}
body.show-db .db-legend{display:block;border:1px dashed var(--db);background:var(--db-bg);border-radius:var(--r-s);padding:12px 14px;font-size:.88rem;margin-bottom:22px}
.db-legend code{font-family:var(--mono);color:var(--db);font-size:.8rem}

/* Accueil / connexion */
.login{display:grid;grid-template-columns:1.1fr 1fr;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.login .side{background:var(--char);color:var(--on-char);padding:38px;display:flex;flex-direction:column;gap:24px}
.login .side .muted{color:var(--on-char-muted)}
.login .form{background:var(--surface);padding:38px;display:flex;flex-direction:column;gap:16px;min-width:0}
.formats{display:grid;gap:10px}
.formats div{border-top:1px solid color-mix(in srgb,var(--on-char) 20%,transparent);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.formats b{font-family:var(--display);font-weight:500}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--copper)}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .side,.login .form{padding:24px}}

/* Parcours : carte des pôles */
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;background:var(--surface)}
.stat b{font-family:var(--display);font-size:1.7rem;font-weight:500;display:block;line-height:1.1}
.poles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pole{display:flex;flex-direction:column;gap:10px}
.pole .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pole .no{font-family:var(--mono);color:var(--copper);font-size:.8rem}
.strip{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.strip span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Leçon */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.app aside{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.app .content{padding:22px;min-width:0;display:flex;flex-direction:column;gap:16px}
.module{border-top:1px solid var(--line);padding-top:10px}
.module > b{font-family:var(--display);font-weight:500;font-size:1rem;display:block;margin-bottom:4px}
.lesson{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:var(--r-s);cursor:pointer;font-size:.88rem}
.lesson:hover,.lesson[aria-current="true"]{background:var(--clay)}
.lesson[aria-current="true"]{font-weight:600}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.lesson.done .dot{background:var(--ok);border-color:var(--ok)}
.lesson.done .dot::after{content:"";width:6px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.tag{font-family:var(--mono);font-size:.68rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag.pays{color:var(--copper);border-color:var(--copper)}

.player{background:var(--char);color:var(--on-char);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column}
.screen{aspect-ratio:16/9;max-width:100%;position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 70%,#7a3a14 0%,#2a1a10 35%,#0a0e0c 75%)}
.screen svg.kiln{width:min(46%,280px)}
.screen .big{position:absolute;width:70px;height:70px;border-radius:50%;border:1px solid rgba(238,242,236,.6);background:rgba(10,14,12,.35);display:grid;place-items:center;cursor:pointer;color:var(--on-char)}
.screen .subs{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:4px 10px;border-radius:4px;font-size:.9rem;max-width:90%;text-align:center}
.screen .loopbadge{position:absolute;top:12px;left:12px;background:var(--copper);color:#fff;font-size:.74rem;padding:3px 9px;border-radius:var(--r-pill)}
.screen .langbadge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);font:500 .72rem var(--mono);padding:3px 8px;border-radius:4px}
.timeline{position:relative;height:28px;margin:0 14px;cursor:pointer}
.timeline .track{position:absolute;left:0;right:0;top:12px;height:4px;background:rgba(238,242,236,.25);border-radius:4px}
.timeline .fill{position:absolute;left:0;top:12px;height:4px;background:var(--copper);border-radius:4px}
.timeline .loop{position:absolute;top:9px;height:10px;background:rgba(181,101,43,.4);border-left:2px solid var(--copper);border-right:2px solid var(--copper)}
.timeline .chap{position:absolute;top:8px;width:2px;height:12px;background:rgba(238,242,236,.7)}
.timeline .knob{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--on-char)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 10px 10px;font-size:.82rem}
.controls button,.controls select{background:none;border:1px solid rgba(238,242,236,.25);color:var(--on-char);border-radius:var(--r-pill);padding:5px 10px;cursor:pointer;width:auto}
.controls select option{color:#1B2420}
.controls button[aria-pressed="true"]{background:var(--on-char);color:var(--char)}
.controls .time{margin:0 6px;font-variant-numeric:tabular-nums;color:rgba(238,242,236,.8)}
.controls input[type=range]{width:80px;accent-color:var(--copper)}
.controls .grow{flex:1}
.chapters{display:flex;gap:8px;flex-wrap:wrap}
.chapters button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 12px;font-size:.82rem;cursor:pointer}
.panel{border:1px solid var(--line);border-radius:var(--r-s);padding:16px}
.datagrid{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.78rem;background:var(--clay)}
td.code{font-family:var(--mono);font-size:.82rem}
.quiz .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;margin:0;font-weight:400}
.quiz .opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.quiz .opt.wrong{border-color:var(--copper);background:color-mix(in srgb,var(--copper) 10%,transparent)}
@media (max-width:880px){.app{grid-template-columns:1fr}.app aside{border-right:0;border-bottom:1px solid var(--line)}}

/* Attestation */
.cert{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:clamp(20px,4vw,48px);display:grid;gap:18px;max-width:820px;margin:0 auto;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid var(--forest);border-radius:8px;pointer-events:none;opacity:.5}
.cert h1{font-size:clamp(1.6rem,3.6vw,2.4rem)}
.cert .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

/* Back-office */
.admin{display:grid;grid-template-columns:240px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.admin aside{background:var(--char);color:var(--on-char);padding:18px;display:flex;flex-direction:column;gap:2px}
.admin aside a{color:var(--on-char-muted);text-decoration:none;padding:9px 12px;border-radius:var(--r-s);font-size:.92rem}
.admin aside a[aria-current="page"]{background:rgba(238,242,236,.1);color:var(--on-char)}
.admin aside .sep{font:500 .66rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--on-char-muted);margin:12px 12px 4px;opacity:.7}
.admin .content{padding:24px;min-width:0;display:flex;flex-direction:column;gap:18px}
.gen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;border:1px solid var(--line);border-radius:var(--r-s);padding:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
details.ls{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 14px;background:var(--surface)}
details.ls summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.ls summary::-webkit-details-marker{display:none}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-m);padding:20px;text-align:center;display:grid;gap:8px;justify-items:center}
.upl-bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;width:100%}
.upl-bar i{display:block;height:100%;background:var(--copper);width:0;transition:width .2s}
.layers{display:grid;grid-template-columns:7fr 3fr;gap:0;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--line)}
.layers div{padding:14px}
.layers .common{background:var(--leaf)}
.layers .local{background:color-mix(in srgb,var(--copper) 18%,var(--surface))}
.sign{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sign span{height:22px;border-radius:3px;background:var(--line)}
.sign span.y{background:var(--ok)} .sign span.n{background:var(--copper)}
@media (max-width:880px){.admin{grid-template-columns:1fr}.admin aside{flex-direction:row;overflow-x:auto}.admin aside .sep{display:none}.gen{grid-template-columns:1fr 1fr}.layers{grid-template-columns:1fr}}
@media (max-width:520px){.gen{grid-template-columns:1fr}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard.open{border-color:var(--forest);box-shadow:0 0 0 1px var(--forest)}
.pchip{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:4px;color:#fff;font:600 .76rem var(--mono)}
.chips{gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 12px;font-size:.84rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--clay);border-color:var(--ink)}
table.matrix td,table.matrix th{padding:7px 10px}
.cascade{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cascade div{flex:1;min-width:150px;border:1px solid var(--line);border-radius:var(--r-s);padding:14px;background:var(--surface);display:grid;gap:4px}
.cascade div b{font-family:var(--display);font-size:2rem;font-weight:500;line-height:1}
.cascade div span{font-size:.84rem;color:var(--muted)}
.cascade i{font-style:normal;color:var(--copper);font-size:1.4rem}
.step-row.is-done b{color:var(--ok)}
.app.proto{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.app.proto aside{border-right:0;border-left:1px solid var(--line)}
@media (max-width:880px){.app.proto{grid-template-columns:1fr}.app.proto aside{border-left:0;border-top:1px solid var(--line)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--clay);padding:9px 16px;border-radius:var(--r-pill);font-size:.9rem;z-index:90}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="mock">
  <div class="wrap">
    <b>Maquette · École REKARBON</b>
    <div class="seg" role="group" aria-label="Rôle">
      <button data-side="eleve" aria-pressed="true">Stagiaire</button>
      <button data-side="ref" aria-pressed="false">Référent partenaire</button>
      <button data-side="admin" aria-pressed="false">REKARBON (back-office)</button>
    </div>
    <div class="seg" role="group" aria-label="Langue · Lokota" id="langSeg"><button data-lang="fr" aria-pressed="true">Français</button><button data-lang="ln" aria-pressed="false">Lingála</button></div>
    <label for="country">Territoire
      <select id="country">
        <option value="GF">Guyane · FR</option><option value="RE">La Réunion · FR</option><option value="CI">Côte d'Ivoire · FR</option>
        <option value="CG">Congo · FR / LN</option><option value="CD">RD Congo · FR / LN</option><option value="VN">Vietnam · EN / VI</option><option value="ID">Indonésie · EN / ID</option>
      </select></label>
    <label for="dbToggle"><input type="checkbox" id="dbToggle"> Cases prévues en base</label>
    <span class="spacer"></span>
    <span style="color:var(--on-char-muted)">Données d'exemple</span>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#accueil"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 14 5v6l-6 4-6-4V5z" fill="none" stroke="#B5652B" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="#7FC39C"/></svg></span><span><b>REKARBON</b><span>École des métiers du carbone</span></span></a>
    <nav class="main" id="nav"></nav>
  </div>
</header>

function render(){
  const h=location.hash.slice(1)||'accueil';const side=sideOf(h);

}

const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
VIEWS.lecon=()=>{const L=LESSONS[current];const done=LESSONS.filter(l=>l.done).length;
return `<div class="app">
  <aside>
    <div class="stack" style="gap:6px">
      <span class="kicker">Pôle 1 · 80 h</span>
      <b data-db="courses.title">Biochar : production et Wood Vault</b>
      <span class="hint num">${done} / ${LESSONS.length} leçons</span>
      <div class="bar"><i style="width:${Math.round(done/LESSONS.length*100)}%"></i></div>
    </div>
    ${MODULES.map((m,mi)=>`<div class="module" ${mi===0?'data-db="modules"':''}><b>${esc(m.t)}</b>
      ${LESSONS.filter(l=>l.mi===mi).map(l=>{const i=LESSONS.indexOf(l);return `<button class="lesson ${l.done?'done':''}" data-i="${i}" ${i===current?'aria-current="true"':''}><span class="dot"></span><span style="flex:1">${esc(l.title)}</span>${l.local?'<span class="tag pays">'+country+'</span>':''}<span class="muted num">${l.min}′</span></button>`}).join('')}
    </div>`).join('')}
  </aside>
  <div class="content">
    <div class="row" style="justify-content:space-between">
      <div style="min-width:0"><p class="muted" data-db="modules.title">${esc(L.mod)}</p><h2 data-db="lesson_variants.title (par langue)">${esc(L.title)}</h2></div>
      <div class="row">${L.local?`<span class="pill cu">Couche ${esc(C().name)}</span>`:'<span class="pill used">Tronc commun</span>'}<span class="pill ${L.done?'ok':'used'}">${L.done?'Vue':'À voir'}</span></div>
    </div>
    <div class="player" data-db="lesson_media.bunny_video_id (+ piste par langue)">
      <div class="screen" id="scr">
        <svg class="kiln" viewBox="0 0 220 150" aria-hidden="true"><path d="M50 140 70 50h80l20 90z" fill="#2a2f2b" stroke="#4a524c"/><rect x="62" y="40" width="96" height="14" rx="3" fill="#3a413c"/><path d="M95 40c-6-14 8-18 2-32M120 40c-6-14 8-18 2-32" stroke="rgba(238,242,236,.35)" stroke-width="3" fill="none"/><path d="M80 120q30-30 60 0" fill="#E0935A" opacity=".7"/><path d="M90 125q20-22 40 0" fill="#ffd27a" opacity=".8"/></svg>
        <span class="langbadge">${C().langs[0]} · sous-titres ${C().langs.join('/')}</span>
        <span class="loopbadge" id="loopBadge" hidden>Répétition A → B</span>
        <button class="big" id="bigPlay" aria-label="Lecture"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <span class="subs" id="subs" data-db="lesson_media.captions (.vtt par langue)"></span>
      </div>
      <div class="timeline" id="tl" role="slider" aria-label="Position" tabindex="0"><div class="track"></div><div class="loop" id="loopZone" hidden></div><div class="fill" id="fill"></div>${CHAPTERS.map(c=>`<span class="chap" style="left:${c[1]*100}%"></span>`).join('')}<div class="knob" id="knob"></div></div>
      <div class="controls">
        <button id="pp">Lecture</button><button id="back">−10 s</button><button id="fwd">+10 s</button>
        <span class="time" id="time"></span><span class="grow"></span>
        <button id="ab" aria-pressed="false">Répéter un passage</button>
        <select id="spd" aria-label="Vitesse">${[.5,.75,1,1.25,1.5,2].map(s=>`<option value="${s}" ${s===1?'selected':''}>×${String(s).replace('.',',')}</option>`).join('')}</select>
        <select id="aud" aria-label="Langue audio">${C().langs.map(l=>`<option>Audio ${l}</option>`).join('')}</select>
        <button id="mute">Son</button><input type="range" id="vol" min="0" max="1" step=".05" value=".8" aria-label="Volume">
        <button id="cc" aria-pressed="true">Sous-titres</button>
        <select id="q" aria-label="Qualité"><option>Auto</option><option>720p</option><option>360p (réseau faible)</option><option>Télécharger hors ligne</option></select>
        <button id="fs">Plein écran</button>
      </div>
    </div>
    <div class="chapters" data-db="lessons.chapters">${CHAPTERS.map((c,i)=>`<button data-c="${i}">${fmt(c[1]*L.min*60)} · ${c[0]}</button>`).join('')}</div>
    <div class="row">
      <button class="btn ${L.done?'btn-ghost':'btn-primary'} btn-small" id="markDone" data-db="lesson_progress + attendance.minutes">${L.done?'Vue ✓':'Marquer comme vue'}</button>
      ${current<LESSONS.length-1?'<button class="btn btn-ghost btn-small" id="next">Leçon suivante</button>':''}
      ${L.quiz?'<a class="btn btn-ghost btn-small" href="#quiz">Évaluation du module</a>':''}
    </div>
    <div class="tabs" role="tablist" id="ltabs">
      <button role="tab" data-t="cours" aria-selected="true">Le cours</button>
      <button role="tab" data-t="pays" aria-selected="false">Au ${esc(C().name)}</button>
      <button role="tab" data-t="data" aria-selected="false">Données du pilote</button>
      <button role="tab" data-t="fiche" aria-selected="false">Fiche protocole</button>
      <button role="tab" data-t="notes" aria-selected="false">Mes notes</button>
      <button role="tab" data-t="qa" aria-selected="false">Questions au formateur</button>
    </div>
    <div id="tabBody"></div>
  </div>
</div>`};
const TABS={
  cours:L=>`<div class="panel stack" data-db="lesson_variants.body"><p>Cette leçon montre <b>${esc(L.title.toLowerCase())}</b> sur le four 4 m³ à post-combustion, avec les gestes de sécurité et les erreurs fréquentes.</p><p class="muted">Référent du pôle : chef opérationnel pyrolyse (20 ans d'expérience) et ingénieur chimiste.</p></div>`,
  pays:L=>`<div class="panel stack" data-db="country_profiles (fiche pays)"><span class="kicker">Couche pays · ${esc(C().name)}</span><p><b>Réglementation :</b> ${esc(C().reg)}</p><p><b>Gisements et contexte local :</b> ${esc(C().local)}</p><p><b>Partenaire :</b> ${esc(C().org)} · <b>Monnaie :</b> ${esc(C().money)}</p><p class="hint">Fiche générée depuis MNEMOSYNE (203 pays), relue par le partenaire local.</p></div>`,
  data:L=>`<div class="stack" data-db="pilot_datasets (données réelles REKARBON)"><p class="muted">Exercice : à partir des mesures réelles des fournées du site ${esc(C().site)}, repérez le lot qu'il faut encore prélever.</p><div class="datagrid"><table><thead><tr><th>Lot</th><th>Biomasse</th><th>T° max</th><th>Volume</th><th>Biochar</th><th>Analyse</th><th>État</th></tr></thead><tbody>${PILOT.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'code':'num'}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`,
  fiche:L=>`<div class="row notice" data-db="lesson_media.pdf_path"><span class="mono" style="background:var(--forest);color:var(--forest-ink);padding:14px 10px;border-radius:4px">PDF</span><div class="stack" style="gap:2px;flex:1;min-width:0"><b>Protocole · ${esc(L.title)}</b><span class="hint">2 pages · ${C().langs.join(' / ')}</span></div><button class="btn btn-ghost btn-small" id="dl">Ouvrir</button></div>`,
  notes:L=>`<div class="stack" data-db="lesson_notes"><label for="note">Mes notes</label><textarea id="note" placeholder="Ex. : humidité < 20 % avant chargement"></textarea><p class="hint">Visibles par vous seul·e. Enregistrées automatiquement.</p></div>`,
  qa:L=>`<div class="stack" data-db="lesson_questions"><div class="notice"><b>Stagiaire exemple 2</b> <span class="hint">hier</span><p>La fumée reste blanche après 20 minutes, c'est normal ?</p><p style="margin-top:6px;padding-left:12px;border-left:2px solid var(--copper)"><b>Formateur :</b> non, le lot est trop humide. Arrêtez et refaites un contrôle d'humidité.</p></div><label for="qIn">Poser une question</label><textarea id="qIn"></textarea><button class="btn btn-primary btn-small" id="qSend" style="justify-self:start">Envoyer</button></div>`
};
AFTER.lecon=()=>{
  const L=LESSONS[current];P={t:0,dur:L.min*60,playing:false,speed:1,loop:null,loopA:null,subs:true,timer:null};
  document.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>{current=+b.dataset.i;render()});
  const draw=()=>{const r=P.t/P.dur*100;$('#fill').style.width=r+'%';$('#knob').style.left=r+'%';$('#time').textContent=fmt(P.t)+' / '+fmt(P.dur);
    const ch=CHAPTERS.reduce((a,c,i)=>P.t/P.dur>=c[1]?i:a,0);$('#subs').textContent=SUBS[ch];$('#subs').hidden=!P.subs;
    $('#pp').textContent=P.playing?'Pause':'Lecture';$('#bigPlay').hidden=P.playing;
    const lz=$('#loopZone');if(P.loop){lz.hidden=false;lz.style.left=P.loop[0]/P.dur*100+'%';lz.style.width=(P.loop[1]-P.loop[0])/P.dur*100+'%'}else lz.hidden=true;$('#loopBadge').hidden=!P.loop};
  const tick=()=>{P.t+=2*P.speed;if(P.loop&&P.t>=P.loop[1])P.t=P.loop[0];if(P.t>=P.dur){P.t=P.dur;toggle(false)}draw()};
  const toggle=on=>{P.playing=on??!P.playing;clearInterval(P.timer);if(P.playing)P.timer=setInterval(tick,250);draw()};
  $('#pp').onclick=()=>toggle();$('#bigPlay').onclick=()=>toggle(true);
  $('#back').onclick=()=>{P.t=Math.max(0,P.t-10);draw()};$('#fwd').onclick=()=>{P.t=Math.min(P.dur,P.t+10);draw()};
  $('#tl').onclick=e=>{const r=$('#tl').getBoundingClientRect();P.t=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*P.dur;draw()};
  $('#tl').onkeydown=e=>{if(e.key==='ArrowRight'){P.t=Math.min(P.dur,P.t+5);draw()}if(e.key==='ArrowLeft'){P.t=Math.max(0,P.t-5);draw()}};
  $('#spd').onchange=e=>{P.speed=+e.target.value;toast('Vitesse ×'+String(P.speed).replace('.',','))};
  $('#aud').onchange=e=>toast(e.target.value);
  $('#ab').onclick=()=>{const b=$('#ab');
    if(P.loop){P.loop=null;b.setAttribute('aria-pressed','false');b.textContent='Répéter un passage';toast('Répétition arrêtée')}
    else if(P.loopA==null){P.loopA=P.t;b.setAttribute('aria-pressed','true');b.textContent='Fin du passage ?';toast('Début marqué. Avancez puis cliquez à nouveau.')}
    else{const a=P.loopA;P.loop=[a,Math.min(Math.max(P.t,a+5),P.dur)];P.loopA=null;b.textContent='Arrêter la répétition';P.t=a;toast('Le passage se répète');toggle(true)}draw()};
  $('#mute').onclick=()=>{const m=$('#mute').textContent==='Son';$('#mute').textContent=m?'Son coupé':'Son';$('#vol').value=m?0:.8};
  $('#cc').onclick=()=>{P.subs=!P.subs;$('#cc').setAttribute('aria-pressed',P.subs);draw()};
  $('#q').onchange=e=>toast(e.target.value.startsWith('Télécharger')?'Vidéo gardée sur le téléphone pour le terrain sans réseau':'Qualité : '+e.target.value);
  $('#fs').onclick=()=>{const el=document.querySelector('.player');if(el.requestFullscreen)el.requestFullscreen().catch(()=>toast('Plein écran indisponible ici'));else toast('Plein écran indisponible ici')};
  document.querySelectorAll('.chapters button').forEach(b=>b.onclick=()=>{P.t=CHAPTERS[+b.dataset.c][1]*P.dur;toggle(true)});
  $('#markDone').onclick=()=>{L.done=!L.done;toast(L.done?'Leçon vue, '+L.min+' min ajoutées à vos heures':'Leçon remise à voir');render()};
  const nx=$('#next');if(nx)nx.onclick=()=>{current++;render()};
  const show=t=>{document.querySelectorAll('#ltabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));$('#tabBody').innerHTML=TABS[t](L);
    if(t==='fiche')$('#dl').onclick=()=>toast('Dans la vraie version, la fiche s’ouvre ici');
    if(t==='notes'){const k='rkb-note-'+L.id;try{$('#note').value=localStorage.getItem(k)||''}catch(_){};$('#note').oninput=e=>{try{localStorage.setItem(k,e.target.value)}catch(_){}}}
    if(t==='qa')$('#qSend').onclick=()=>{if(!$('#qIn').value.trim())return toast('Écrivez votre question');$('#qIn').value='';toast('Question envoyée au formateur')}};
  document.querySelectorAll('#ltabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));show('cours');draw();
};

/* ---------- Stagiaire : évaluation ---------- */
VIEWS.quiz=()=>`<div class="card stack quiz" style="max-width:760px;margin:0 auto" data-db="quizzes + quiz_questions">
  <span class="kicker">Pôle 1 · Module Pyrolyse · Évaluation</span>
  <h1 style="font-size:1.9rem">Vérifiez vos acquis</h1>
  <p class="muted">3 questions. Il faut 2 bonnes réponses pour valider le module. Les tentatives sont gardées pour le suivi Qualiopi.</p>
  <form id="qz" class="stack">
    ${QUIZ.map((q,i)=>`<fieldset class="stack" style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:8px">${i+1}. ${esc(q.q)}</legend>
      ${q.o.map((o,j)=>`<label class="opt" data-q="${i}" data-o="${j}"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</fieldset>`).join('')}
    <button class="btn btn-primary" style="justify-self:start">Valider mes réponses</button>
  </form>
  <div id="qzRes" class="notice" hidden data-db="quiz_attempts.score"></div>
</div>`;
AFTER.quiz=()=>{$('#qz').onsubmit=e=>{e.preventDefault();let s=0;
  QUIZ.forEach((q,i)=>{const v=document.querySelector(`input[name=q${i}]:checked`);document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(l=>{l.classList.remove('right','wrong');if(+l.dataset.o===q.a)l.classList.add('right');else if(v&&+v.value===+l.dataset.o)l.classList.add('wrong')});if(v&&+v.value===q.a)s++});
  const r=$('#qzRes');r.hidden=false;r.innerHTML=s>=2?`<b>${s}/3 : module validé.</b> Il compte pour votre attestation.`:`<b>${s}/3 : pas encore.</b> Revoyez les leçons en vert puis réessayez.`;}};

  </div>

/* ---------- Référentiel des métiers ---------- */
let MF={d:'',n:'',f:'',q:'',g:false,sel:null};
const metiersBody=()=>`
<div class="stack" style="gap:22px">
  <div class="stack" style="gap:6px"><span class="kicker">Référentiel des métiers du carbone</span><h1>${METIERS.length} métiers, ${DOMAINES.length} domaines, ${POLES.length} pôles</h1>
  <p class="muted" style="max-width:60em">Chaque métier est un assemblage de pôles. La plateforme en fait un parcours, avec une attestation au nom du métier. Le parcours 600 h vise d'abord les opérateurs et techniciens de terrain ; les profils ingénieurs et cadres passent par des modules de formation continue.</p></div>
  <div class="hours">
    ${[1,2,3,4].map(n=>`<div class="stat"><b class="num">${METIERS.filter(m=>m.n===n).length}</b><span class="muted">${NIV[n].toLowerCase()}s</span></div>`).join('')}
    <div class="stat"><b class="num">${METIERS.filter(m=>m.guyane).length}</b><span class="muted">créés sur place par les pilotes</span></div>
  </div>
  <div class="card stack" data-db="job_roles × courses (matrice)">
    <div class="row" style="justify-content:space-between"><h3>Quels pôles forment quels domaines</h3><span class="hint">Nombre de métiers du domaine qui passent par le pôle</span></div>
    <div class="tbl-wrap"><table class="matrix"><thead><tr><th>Domaine</th>${POLES.map(p=>`<th title="${esc(p.t)}" style="text-align:center">${p.n}${p.nw?'*':''}</th>`).join('')}</tr></thead><tbody>
    ${DOMAINES.map(([k,lab,col])=>`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${col};margin-right:8px"></span>${lab}</td>${POLES.map(p=>{const c=METIERS.filter(m=>m.d===k&&m.p.includes(p.n)).length;return `<td class="num" style="text-align:center;background:${c?`color-mix(in srgb,${p.c} ${Math.min(85,c*14)}%,transparent)`:'transparent'};color:${c>3?'#fff':'inherit'}">${c||''}</td>`}).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="hint">* Pôles proposés : 8 « Mer et carbone bleu », 9 « Comptabilité carbone et RSE ».</p>
  </div>
  <div class="card stack">
    <div class="row">
      <div style="flex:2;min-width:200px"><label for="mq">Chercher un métier</label><input id="mq" type="text" placeholder="Ex. : pyrolyse, mangrove, CSRD" value="${esc(MF.q)}"></div>
      <div style="flex:1;min-width:150px"><label for="mn">Niveau</label><select id="mn"><option value="">Tous</option>${[1,2,3,4].map(n=>`<option value="${n}" ${MF.n==n?'selected':''}>${NIV[n]}</option>`).join('')}</select></div>
      <div style="flex:1;min-width:150px"><label for="mf">Format</label><select id="mf"><option value="">Tous</option>${Object.entries(FMT).map(([k,v])=>`<option value="${k}" ${MF.f===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <label style="margin:0;align-self:flex-end;padding-bottom:10px;font-weight:400"><input type="checkbox" id="mg" ${MF.g?'checked':''}> Emplois créés par les pilotes</label>
    </div>
    <div class="row chips" role="group" aria-label="Domaines"><button data-d="" aria-pressed="${!MF.d}">Tous les domaines</button>${DOMAINES.map(([k,lab])=>`<button data-d="${k}" aria-pressed="${MF.d===k}">${lab}</button>`).join('')}</div>
  </div>
  <div id="mlist" class="mgrid"></div>
</div>`;
function drawMetiers(){
  const q=MF.q.toLowerCase();
  const list=METIERS.map((m,i)=>({...m,i})).filter(m=>(!MF.d||m.d===MF.d)&&(!MF.n||m.n==MF.n)&&(!MF.f||m.f.includes(MF.f))&&(!MF.g||m.guyane)&&(!q||m.t.toLowerCase().includes(q)||m.p.some(n=>PH(n).t.toLowerCase().includes(q))));
  const dom=k=>DOMAINES.find(d=>d[0]===k);
  $('#mlist').innerHTML=list.length?list.map(m=>{const h=m.p.reduce((s,n)=>s+PH(n).h,0);const open=MF.sel===m.i;return `
  <article class="card mcard ${open?'open':''}" ${m.i===21?'data-db="job_roles (métier → pôles, niveau, formats)"':''}>
    <div class="row" style="justify-content:space-between;gap:6px"><span class="kicker" style="margin:0;color:${dom(m.d)[2]}">${esc(dom(m.d)[1])}</span>${m.guyane?'<span class="pill ok">Emploi pilote</span>':''}</div>
    <h3>${esc(m.t)}</h3>
    <div class="row" style="gap:6px"><span class="pill used">${NIV[m.n]}</span>${m.f.map(f=>`<span class="tag">${FMT[f]}</span>`).join('')}</div>
    <div class="row" style="gap:4px">${m.p.map(n=>`<span class="pchip" style="background:${PH(n).c}" title="${esc(PH(n).t)}">${n}</span>`).join('')}<span class="hint num" style="margin-left:6px">${h} h de pôles</span></div>
    ${open?`<div class="stack" style="gap:8px;border-top:1px solid var(--line);padding-top:10px">${m.p.map(n=>`<div class="row" style="justify-content:space-between"><span><span class="mono" style="color:var(--copper)">PÔLE ${n}</span> ${esc(PH(n).t)}</span><span class="mono">${PH(n).h} h</span></div>`).join('')}
      <p class="hint">Attestation : « ${esc(m.t)} », délivrée par ${esc(C().of)}.</p>
      <div class="row"><button class="btn btn-primary btn-small" data-enrol="${m.i}">S'inscrire à ce parcours</button><button class="btn btn-ghost btn-small" data-close>Fermer</button></div></div>`
    :`<button class="btn btn-ghost btn-small" style="justify-self:start" data-open="${m.i}">Voir le parcours</button>`}
  </article>`}).join(''):'<p class="muted">Aucun métier ne correspond à ces filtres.</p>';
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{MF.sel=+b.dataset.open;drawMetiers()});
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{MF.sel=null;drawMetiers()});
  document.querySelectorAll('[data-enrol]').forEach(b=>b.onclick=()=>toast('Demande d’inscription envoyée (maquette)'));
}
function bindMetiers(){
  $('#mq').oninput=e=>{MF.q=e.target.value;drawMetiers()};
  $('#mn').onchange=e=>{MF.n=e.target.value;drawMetiers()};
  $('#mf').onchange=e=>{MF.f=e.target.value;drawMetiers()};
  $('#mg').onchange=e=>{MF.g=e.target.checked;drawMetiers()};
  document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{MF.d=b.dataset.d;document.querySelectorAll('.chips button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawMetiers()});
  drawMetiers();

const ORIG=new WeakMap();
function tr(s){
  const t=s.trim();if(!t)return s;
  if(Object.prototype.hasOwnProperty.call(LN,t))return s.replace(t,LN[t]);
  if(t.indexOf(' · ')>-1){const parts=t.split(' · ');if(parts.some(p=>Object.prototype.hasOwnProperty.call(LN,p)))return s.replace(t,parts.map(p=>Object.prototype.hasOwnProperty.call(LN,p)?LN[p]:tr(p)).join(' · '))}
  let o=s;for(const k of KEYS){if(o.indexOf(k)>-1)o=o.split(k).join(LN[k])}
  for(const [r,v] of RX)o=o.replace(r,v);
  return o;
}
const ATTRS=['placeholder','aria-label','title'];
function apply(root){
  if(!root)return;
  if(root.nodeType===3){fix(root);return}
  if(root.nodeType!==1)return;
  if(root.tagName==='SCRIPT'||root.tagName==='STYLE')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode&&n.parentNode.nodeName;return p==='SCRIPT'||p==='STYLE'?2:1}});
  let n;while((n=w.nextNode())){if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('#langSeg'))continue;fix(n)}
  const els=[root,...root.querySelectorAll('*')];
  for(const el of els)for(const a of ATTRS){if(!el.hasAttribute||!el.hasAttribute(a))continue;const key='data-fr-'+a;if(!el.hasAttribute(key))el.setAttribute(key,el.getAttribute(a));const fr=el.getAttribute(key);el.setAttribute(a,lang==='ln'?tr(fr):fr)}
}
function fix(n){
  if(!ORIG.has(n))ORIG.set(n,n.nodeValue);
  const fr=ORIG.get(n);const v=lang==='ln'?tr(fr):fr;
  if(n.nodeValue!==v)n.nodeValue=v;
}
new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(apply)}).observe(document.body,{childList:true,subtree:true});
function setLang(l,user){
  lang=l;try{localStorage.setItem('rkb-lang',l)}catch(_){}
  document.documentElement.lang=l==='ln'?'ln':'fr';
  document.querySelectorAll('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  const sel=document.getElementById('country');
  if(user&&l==='ln'&&sel&&sel.value!=='CG'&&sel.value!=='CD'){sel.value='CG';sel.dispatchEvent(new Event('change'))}
  apply(document.body);
}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang,true));
setLang(lang,false);
})();
</script>
